# Phase 2+5 combined: OV3660 capture to SD + Wi-Fi HTTP gallery (one firmware)

# --- Camera (from cam-capture-sd-sense.conf) ---
CONFIG_VIDEO=y
CONFIG_VIDEO_ESP32=y
CONFIG_VIDEO_SW_GENERATOR=n
CONFIG_VIDEO_OV3660=y
CONFIG_DMA=y
CONFIG_DMA_ESP32=y

# 1024x768 in combined build (native 1/2 QXGA; full QXGA needs cam_capture_sd)
CONFIG_VIDEO_BUFFER_POOL_SZ_MAX=819200
CONFIG_VIDEO_BUFFER_POOL_NUM_MAX=2
CONFIG_VIDEO_BUFFER_POOL_ALIGN=32
# 1024x768 buffer = 786432 B → ceil(786432/4095) = 193 blocks; use 256 for headroom
CONFIG_DMA_ESP32_MAX_DESCRIPTOR_NUM=256
# Wi-Fi adapter uses k_malloc (heap_caps ignores caps); pool must exceed ~46 KB default
CONFIG_HEAP_MEM_POOL_SIZE=114688
CONFIG_VIDEO_BUFFER_USE_SHARED_MULTI_HEAP=y
CONFIG_VIDEO_BUFFER_SMH_ATTRIBUTE=2

CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
# Wi-Fi + net buffers in PSRAM so internal DRAM survives DMA static pools
CONFIG_ESP32_WIFI_NET_ALLOC_SPIRAM=y
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=8
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_CACHE_TX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=16
CONFIG_ESP32_WIFI_MGMT_SBUF_NUM=16

# --- SD + FAT ---
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_DISK_DRIVER_SDMMC=y

# --- Wi-Fi + HTTP (from wifi-sense + sd-gallery) ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_DHCPV4=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Match sd_gallery — large JPEG downloads need more net_buf or TCP send stalls
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# --- Common ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_PICOLIBC_USE_MODULE=y
CONFIG_DISPLAY=n

CONFIG_MAIN_STACK_SIZE=8192
